<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>數獨</title>
<!-- PWA / iOS 主畫面設定 -->
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="icon" type="image/png" href="./icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="數獨">
<meta name="theme-color" content="#E6ECEF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111A22" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E6ECEF; --board:#F8FAFB; --ink:#1B2A38; --ink-soft:#5A6B7A;
  --pen:#2A5BA8; --line:#B9C6D0; --line-bold:#1B2A38;
  --peer:#DCE6EE; --same:#BFD8CC; --sel:#9FC7B4; --wrong:#C23B2E; --wrong-bg:#F6DAD6;
  --btn:#D3DDE4; --btn-on:#1B2A38; --btn-on-ink:#F8FAFB;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111A22; --board:#18232D; --ink:#E4ECF1; --ink-soft:#8FA2B1;
    --pen:#7FB0F0; --line:#2E3E4C; --line-bold:#A9BBC8;
    --peer:#1F2D39; --same:#24463B; --sel:#2F6451; --wrong:#FF8A7D; --wrong-bg:#4A2522;
    --btn:#223240; --btn-on:#E4ECF1; --btn-on-ink:#111A22;
  }
}
:root[data-theme="dark"]{
  --paper:#111A22; --board:#18232D; --ink:#E4ECF1; --ink-soft:#8FA2B1;
  --pen:#7FB0F0; --line:#2E3E4C; --line-bold:#A9BBC8;
  --peer:#1F2D39; --same:#24463B; --sel:#2F6451; --wrong:#FF8A7D; --wrong-bg:#4A2522;
  --btn:#223240; --btn-on:#E4ECF1; --btn-on-ink:#111A22;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-user-select:none;user-select:none;
  overscroll-behavior:none}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translate(-50%,150%);
  display:flex;align-items:center;gap:14px;background:var(--btn-on);color:var(--btn-on-ink);padding:10px 10px 10px 18px;
  border-radius:12px;z-index:20;transition:transform .25s ease-out;max-width:calc(100% - 28px)}
.toast.show{transform:translate(-50%,0)}
.toast button{border:0;background:var(--btn-on-ink);color:var(--btn-on);font:inherit;font-weight:700;padding:8px 14px;border-radius:8px;cursor:pointer}
.ver{color:var(--ink-soft);font-size:.72rem;text-align:center;opacity:.7}
.wrap{max-width:500px;margin:0 auto;padding:16px 14px 28px;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
h1{margin:0;font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:2.4rem;line-height:1;letter-spacing:.04em}
.meta{display:flex;gap:14px;align-items:baseline;color:var(--ink-soft);font-size:.9rem}
.meta b{color:var(--ink);font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:1.15rem;font-variant-numeric:tabular-nums}
.mode{display:flex;align-items:center;gap:8px}
.mode-btn{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;text-align:left;padding:4px 0;cursor:pointer}
.mode-btn .main{display:block;font-family:"Fraunces","Noto Sans TC",Georgia,serif;font-weight:600;font-size:1.3rem;line-height:1.2}
.mode-btn .main::after{content:"";display:inline-block;width:.42em;height:.42em;margin-left:.4em;border-right:2px solid currentColor;
  border-bottom:2px solid currentColor;transform:translateY(-.2em) rotate(45deg)}
.mode-btn .sub{display:block;font-size:.78rem;color:var(--ink-soft)}
.pill{border:1.5px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:.85rem;padding:7px 11px;
  border-radius:999px;cursor:pointer;white-space:nowrap}
.sheet{background:var(--board);color:var(--ink);border-radius:14px;width:100%;max-width:500px;max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 6px}
.sheet-head h2{margin:0;font-size:1.2rem}
.sheet-head .x{border:0;background:transparent;color:var(--ink);font-size:1.6rem;line-height:1;padding:4px 8px;cursor:pointer}
.sheet-sub{padding:0 16px;color:var(--ink-soft);font-size:.85rem}
.jump{display:flex;gap:8px;padding:12px 16px 0}
.jump input{flex:1;min-width:0;border:1.5px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:16px;
  padding:9px 12px;border-radius:10px}
.jump button{border:0;background:var(--btn-on);color:var(--btn-on-ink);font:inherit;padding:9px 16px;border-radius:10px;cursor:pointer}
.jump-err{padding:4px 16px 0;color:var(--wrong);font-size:.8rem;min-height:1.2em}
.pager{display:flex;align-items:center;justify-content:center;gap:18px;padding:6px 16px}
.pager button{border:0;background:var(--btn);color:var(--ink);width:40px;height:34px;border-radius:8px;font-size:1.1rem;cursor:pointer}
.pager button:disabled{opacity:.3;cursor:default}
.pager span{min-width:90px;text-align:center;font-variant-numeric:tabular-nums;font-weight:500}
.level-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;padding:8px 16px 18px;overflow-y:auto}
.level-grid button{position:relative;aspect-ratio:1;border:0;border-radius:6px;background:var(--peer);color:var(--ink);
  font:inherit;font-size:clamp(.6rem,2.6vw,.8rem);font-variant-numeric:tabular-nums;padding:0;cursor:pointer}
.level-grid button.cleared{background:var(--sel);font-weight:700}
.level-grid button.going::after{content:"";position:absolute;right:3px;top:3px;width:5px;height:5px;border-radius:50%;background:var(--pen)}
.level-grid button.current{outline:2px solid var(--ink);outline-offset:-2px}
.legend{display:flex;gap:14px;padding:4px 16px 0;font-size:.75rem;color:var(--ink-soft)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.debug{position:fixed;top:calc(4px + env(safe-area-inset-top,0px));right:4px;z-index:30;display:flex;gap:6px;align-items:center;
  background:rgba(0,0,0,.72);color:#fff;font:12px/1.4 system-ui,sans-serif;padding:4px 6px;border-radius:6px}
.debug button{font:inherit;border:0;border-radius:4px;padding:2px 6px;cursor:pointer}
.board{width:100%;aspect-ratio:1;display:grid;grid-template-columns:repeat(9,1fr);background:var(--board);
  border:2.5px solid var(--line-bold);border-radius:4px;touch-action:manipulation;user-select:none}
.cell{position:relative;display:flex;align-items:center;justify-content:center;border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);font-family:"Fraunces",Georgia,serif;font-size:clamp(1.2rem,6vw,1.9rem);cursor:pointer;
  transition:background-color .12s}
.cell:nth-child(9n){border-right:0}
.cell:nth-child(n+73){border-bottom:0}
.cell.br{border-right:2px solid var(--line-bold)}
.cell.bb{border-bottom:2px solid var(--line-bold)}
.cell.peer{background:var(--peer)}
.cell.same{background:var(--same)}
.cell.sel{background:var(--sel)}
.cell.given{color:var(--ink);font-weight:600}
.cell.user{color:var(--pen);font-weight:400}
.cell.wrong{color:var(--wrong);background:var(--wrong-bg)}
.cell.sel.wrong{background:var(--sel)}
.cell:focus-visible{outline:2px solid var(--pen);outline-offset:-3px}
.notes{position:absolute;inset:2px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
  font-family:"Noto Sans TC",system-ui,sans-serif;font-size:clamp(.5rem,2.3vw,.72rem);color:var(--ink-soft);line-height:1}
.notes span{display:flex;align-items:center;justify-content:center}
.notes span.hl{color:var(--ink);font-weight:700}
.pop{animation:pop .22s ease-out}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tools button{border:0;background:transparent;color:var(--ink);font:inherit;font-size:.85rem;display:flex;flex-direction:column;
  align-items:center;gap:4px;padding:6px 0;cursor:pointer;border-radius:10px}
.tools svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tools button[aria-pressed="true"]{background:var(--btn-on);color:var(--btn-on-ink)}
.tools button:disabled{opacity:.35;cursor:default}
.pad{display:grid;grid-template-columns:repeat(9,1fr);gap:5px}
.pad button{border:0;border-radius:8px;background:var(--btn);color:var(--ink);cursor:pointer;padding:8px 0 5px;
  display:flex;flex-direction:column;align-items:center;gap:1px;font:inherit}
.pad button .d{font-family:"Fraunces",Georgia,serif;font-size:clamp(1.3rem,6vw,1.7rem);line-height:1.1;color:var(--pen)}
.pad button .n{font-size:.68rem;color:var(--ink-soft)}
.pad.notes-on button .d{color:var(--ink-soft);font-size:clamp(1rem,4.6vw,1.3rem)}
.pad button.done{visibility:hidden}
button:focus-visible{outline:2px solid var(--pen);outline-offset:2px}
.overlay{position:fixed;inset:0;padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));background:rgba(10,18,26,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
.overlay.show{display:flex}
.card{background:var(--board);color:var(--ink);border-radius:14px;padding:28px 24px;max-width:340px;width:100%;text-align:center}
.card h2{font-family:"Fraunces",Georgia,serif;font-size:2rem;margin:0 0 8px}
.card p{margin:0 0 20px;color:var(--ink-soft);line-height:1.6}
.card .row{display:flex;gap:10px}
.card button{flex:1;border:0;background:var(--btn-on);color:var(--btn-on-ink);font:inherit;font-weight:500;padding:12px;border-radius:10px;cursor:pointer}
.card button[hidden]{display:none}
.card button.alt{background:var(--btn);color:var(--ink)}
.hint-keys{color:var(--ink-soft);font-size:.78rem;text-align:center;line-height:1.6}
@media (hover:none){.hint-keys{display:none}}
@media (prefers-reduced-motion:reduce){.pop{animation:none}.cell{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>數獨</h1>
    <div class="meta">
      <span>錯誤 <b id="mistakes">0</b></span>
      <span><b id="timer">00:00</b></span>
    </div>
  </header>

  <div class="mode">
    <button class="mode-btn" id="modeBtn" aria-label="選擇關卡"><span class="main" id="modeMain">第 1 關</span><span class="sub" id="modeSub"></span></button>
    <button class="pill" id="randLevelBtn">隨機一關</button>
    <button class="pill" id="boardBtn">隨機盤面</button>
  </div>

  <div class="board" id="board" role="grid" aria-label="數獨盤面"></div>

  <div class="tools">
    <button id="undo" aria-label="復原"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>復原</button>
    <button id="erase" aria-label="擦除"><svg viewBox="0 0 24 24"><path d="m7 21-4-4 11-11 7 7-8 8Z"/><path d="M7 21h13"/><path d="m9.5 10.5 7 7"/></svg>擦除</button>
    <button id="notes" aria-pressed="false" aria-label="筆記模式"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>筆記</button>
    <button id="hint" aria-label="提示"><svg viewBox="0 0 24 24"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.2 1 2V17h6v-.3c0-.8.4-1.5 1-2A7 7 0 0 0 12 2Z"/></svg>提示 <span id="hintsLeft"></span></button>
  </div>

  <div class="pad" id="pad"></div>

  <div class="hint-keys">鍵盤：1–9 填數字、方向鍵移動、Backspace 擦除、N 切換筆記、Ctrl+Z 復原</div>
  <div class="ver" id="ver"></div>
</div>

<div class="overlay" id="pickerBox" role="dialog" aria-modal="true" aria-labelledby="pickerTitle">
  <div class="sheet">
    <div class="sheet-head"><h2 id="pickerTitle">選擇關卡</h2><button class="x" id="pickerClose" aria-label="關閉">×</button></div>
    <div class="sheet-sub" id="clearedCount"></div>
    <div class="jump"><input id="jumpInput" type="number" inputmode="numeric" min="1" max="2000" placeholder="輸入關卡編號" aria-label="關卡編號"><button id="jumpBtn">前往</button></div>
    <div class="jump-err" id="jumpErr" role="alert"></div>
    <div class="legend"><span><i style="background:var(--sel)"></i>已過關</span><span><i style="width:6px;height:6px;border-radius:50%;background:var(--pen);vertical-align:1px"></i>進行中</span></div>
    <div class="pager"><button id="pagePrev" aria-label="上一頁">‹</button><span id="pageLabel"></span><button id="pageNext" aria-label="下一頁">›</button></div>
    <div class="level-grid" id="levelGrid"></div>
  </div>
</div>

<div class="toast" id="updateToast" role="status"><span>有新版本</span><button id="updateBtn">更新</button></div>

<div class="overlay" id="winBox" role="dialog" aria-modal="true" aria-labelledby="winTitle">
  <div class="card">
    <h2 id="winTitle">完成了</h2>
    <p id="winText"></p>
    <div class="row"><button class="alt" id="winPick">選關</button><button id="winNext">下一關</button></div>
  </div>
</div>

<div class="overlay" id="confirmBox" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
  <div class="card">
    <h2 id="confirmTitle" style="font-size:1.4rem">換一盤隨機盤面？</h2>
    <p>目前這盤隨機盤面的進度不會保留。固定關卡的進度不受影響。</p>
    <div class="row"><button class="alt" id="cancelNew">繼續玩</button><button id="confirmNew">換一盤</button></div>
  </div>
</div>

<script>
(() => {
  // ============================================================
  // CONFIG：所有可調參數集中在這裡
  // ============================================================
  const CONFIG = {
    LEVEL_COUNT: 2000,      // 固定關卡數量
    CLUES: 23,              // 目標提示數字數量（專家難度；實際可能停在 23–26，才能保證唯一解）
    HINTS: 3,               // 每盤可用提示次數
    LEVEL_SALT: 0x5D0C0,    // 關卡種子鹽值。⚠ 改了會讓 1–2000 關內容全部改變，請勿修改
    PAGE_SIZE: 100,         // 選關畫面每頁關卡數
    STORE_KEY: 'sudoku-v2', // localStorage 存檔鍵名
    DEBUG: false,           // 除錯列：FPS、種子、重開、直接完成、下一關
  };

  // ============================================================
  // 工具：格子索引、同列同行同宮、可重現的亂數
  // ============================================================
  const R = i => (i/9)|0, C = i => i%9, B = i => ((R(i)/3)|0)*3 + ((C(i)/3)|0);
  const PEERS = Array.from({length:81}, (_, i) => {
    const s = new Set();
    for (let j=0;j<81;j++) if (j!==i && (R(j)===R(i)||C(j)===C(i)||B(j)===B(i))) s.add(j);
    return [...s];
  });
  const bits = m => { const out=[]; for (let d=1;d<=9;d++) if (m & (1<<d)) out.push(d); return out; };
  // mulberry32：同一個種子永遠產生同一串亂數
  function mulberry32(a){
    return () => { a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; };
  }
  const shuffle = (a, rng) => { for (let i=a.length-1;i>0;i--){const j=rng()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; };
  const levelSeed = n => (Math.imul(n, 0x9E3779B1) ^ CONFIG.LEVEL_SALT) >>> 0;
  const fmt = t => { const h=(t/3600)|0, m=((t%3600)/60)|0, s=t%60; const p=n=>String(n).padStart(2,'0'); return (h? h+':' : '') + p(m)+':'+p(s); };

  // ============================================================
  // 邏輯：解題器與盤面生成（⚠ 生成流程改了會讓固定關卡改變）
  // ============================================================
  // 位元遮罩回溯求解；limit=2 用來判斷唯一解；rng 有給時隨機嘗試順序
  function solve(g, limit, rng){
    const rows=new Array(9).fill(0), cols=new Array(9).fill(0), boxes=new Array(9).fill(0);
    for (let i=0;i<81;i++) if (g[i]) { const b=1<<g[i]; rows[R(i)]|=b; cols[C(i)]|=b; boxes[B(i)]|=b; }
    let count=0, first=null;
    (function rec(){
      let best=-1, bestMask=0, bestN=10;
      for (let i=0;i<81;i++) if (!g[i]) {
        const m = ~(rows[R(i)]|cols[C(i)]|boxes[B(i)]) & 0x3FE;
        let n=0; for (let x=m;x;x&=x-1) n++;
        if (n<bestN){ best=i; bestMask=m; bestN=n; if (n===0) return false; if (n===1) break; }
      }
      if (best===-1){ count++; if (!first) first=g.slice(); return count>=limit; }
      const ds = rng ? shuffle(bits(bestMask), rng) : bits(bestMask);
      const r=R(best), c=C(best), bx=B(best);
      for (const d of ds){
        const b=1<<d;
        g[best]=d; rows[r]|=b; cols[c]|=b; boxes[bx]|=b;
        const stop = rec();
        g[best]=0; rows[r]&=~b; cols[c]&=~b; boxes[bx]&=~b;
        if (stop) return true;
      }
      return false;
    })();
    return {count, first};
  }

  // 由種子產生盤面：隨機完整解 → 依隨機順序挖空，每挖一格都確認仍是唯一解
  function generate(seed){
    const rng = mulberry32(seed);
    const solution = solve(new Array(81).fill(0), 1, rng).first;
    const puzzle = solution.slice();
    let filled = 81;
    for (const i of shuffle([...Array(81).keys()], rng)){
      if (filled <= CONFIG.CLUES) break;
      const keep = puzzle[i];
      puzzle[i] = 0;
      if (solve(puzzle.slice(), 2, null).count !== 1) puzzle[i] = keep;
      else filled--;
    }
    return {puzzle, solution};
  }

  // ============================================================
  // 存檔：每關各自保留進度、過關紀錄
  // DB = { cur:{mode,level}, prog:{ 'L關卡號' | 'R' : 進度 }, best:{ 關卡號: 最佳秒數 }, notesMode }
  // ============================================================
  function loadDB(){
    try { const d = JSON.parse(localStorage.getItem(CONFIG.STORE_KEY)); if (d && d.prog && d.best) return d; } catch(e){}
    return { cur:null, prog:{}, best:{}, notesMode:false };
  }
  const DB = loadDB();
  const persist = () => { try { localStorage.setItem(CONFIG.STORE_KEY, JSON.stringify(DB)); } catch(e){} };
  const keyOf = (mode, level) => mode==='level' ? 'L'+level : 'R';

  // ============================================================
  // 狀態
  // ============================================================
  let S = null;
  const $ = id => document.getElementById(id);
  const board = $('board'), pad = $('pad');

  // 把目前盤面寫回存檔
  function snapshot(){
    if (!S || S.done) return;
    const used = S.values.some((v,k)=>v && !S.puzzle[k]) || S.notes.some(n=>n);
    DB.prog[keyOf(S.mode, S.level)] = { seed:S.seed, v:S.values.join(''), n:S.notes.slice(), m:S.mistakes, h:S.hints, t:S.time, u:used };
    DB.cur = { mode:S.mode, level:S.level };
    DB.notesMode = S.notesMode;
    persist();
  }

  function start(mode, level, seed){
    const {puzzle, solution} = generate(seed);
    S = { mode, level, seed, puzzle, solution, values:puzzle.slice(), notes:new Array(81).fill(0),
          sel:-1, notesMode:!!DB.notesMode, history:[], mistakes:0, hints:CONFIG.HINTS, time:0, done:false };
    const rec = DB.prog[keyOf(mode, level)];
    if (rec && rec.seed === seed && rec.v.length === 81){
      S.values = rec.v.split('').map(Number); S.notes = rec.n.slice();
      S.mistakes = rec.m; S.hints = rec.h; S.time = rec.t;
    }
    S.sel = S.values.findIndex((v,k)=>v!==solution[k]);
    DB.cur = { mode, level }; persist();
    render();
  }

  const clampLevel = n => Math.min(CONFIG.LEVEL_COUNT, Math.max(1, n|0));
  function openLevel(n){ snapshot(); n = clampLevel(n); start('level', n, levelSeed(n)); }
  // fresh=true：丟掉舊的隨機盤面，產生新的
  function openRandomBoard(fresh){
    snapshot();
    const rec = DB.prog.R;
    if (fresh) delete DB.prog.R;
    const seed = (!fresh && rec) ? rec.seed : (Math.random()*4294967296)>>>0;
    start('random', 0, seed);
  }
  function randomLevel(){
    let n;
    do { n = 1 + (Math.random()*CONFIG.LEVEL_COUNT|0); } while (CONFIG.LEVEL_COUNT>1 && S && S.mode==='level' && n===S.level);
    openLevel(n);
  }

  // ============================================================
  // 計時
  // ============================================================
  const anyOverlay = () => document.querySelector('.overlay.show');
  setInterval(() => {
    if (!S || S.done || document.hidden || anyOverlay()) return;
    S.time++; $('timer').textContent = fmt(S.time);
    if (S.time % 5 === 0) snapshot();
  }, 1000);
  document.addEventListener('visibilitychange', () => { if (document.hidden) snapshot(); });

  // ============================================================
  // 輸入處理
  // ============================================================
  function select(i){ if (!S) return; S.sel = i; render(); cells[i].focus({preventScroll:true}); }
  function pushHistory(i){ S.history.push({i, v:S.values[i], n:S.notes[i], peers: PEERS[i].map(p=>[p,S.notes[p]])}); if (S.history.length>200) S.history.shift(); }

  function input(d){
    if (!S || S.done || S.sel<0) return;
    const i = S.sel;
    if (S.puzzle[i]) return;
    if (S.values[i] && S.values[i]===S.solution[i]) return;
    if (S.notesMode){
      if (S.values[i]) return;
      pushHistory(i);
      S.notes[i] ^= (1<<d);
      render(); snapshot(); return;
    }
    if (S.values[i]===d) return;
    pushHistory(i);
    S.values[i] = d; S.notes[i] = 0;
    if (d !== S.solution[i]) S.mistakes++;
    else for (const p of PEERS[i]) S.notes[p] &= ~(1<<d);
    render(i); snapshot(); checkWin();
  }

  function erase(){
    if (!S || S.done) return;
    const i = S.sel;
    if (i<0 || S.puzzle[i]) return;
    if (S.values[i] && S.values[i]===S.solution[i]) return;
    if (!S.values[i] && !S.notes[i]) return;
    pushHistory(i); S.values[i]=0; S.notes[i]=0; render(); snapshot();
  }

  function undo(){
    if (!S || S.done || !S.history.length) return;
    const h = S.history.pop();
    S.values[h.i]=h.v; S.notes[h.i]=h.n; for (const [p,n] of h.peers) S.notes[p]=n;
    S.sel = h.i; render(); snapshot();
  }

  function hint(){
    if (!S || S.done || S.hints<=0) return;
    let i = S.sel;
    if (i<0 || S.values[i]===S.solution[i]){
      const open = [...Array(81).keys()].filter(k => S.values[k]!==S.solution[k]);
      if (!open.length) return;
      i = open[Math.random()*open.length|0];
    }
    pushHistory(i);
    S.values[i]=S.solution[i]; S.notes[i]=0; S.hints--; S.sel=i;
    for (const p of PEERS[i]) S.notes[p] &= ~(1<<S.solution[i]);
    render(i); snapshot(); checkWin();
  }

  function checkWin(){
    if (!S.values.every((v,k)=>v===S.solution[k])) return;
    S.done = true;
    delete DB.prog[keyOf(S.mode, S.level)];
    let line = `用時 ${fmt(S.time)}，錯誤 ${S.mistakes} 次，提示用了 ${CONFIG.HINTS-S.hints} 次`;
    if (S.mode==='level'){
      const prev = DB.best[S.level], isBest = prev==null || S.time < prev;
      if (isBest) DB.best[S.level] = S.time;
      line += isBest && prev!=null ? '<br>新的最佳紀錄' : `<br>最佳紀錄 ${fmt(DB.best[S.level])}`;
      $('winTitle').textContent = `第 ${S.level} 關完成`;
      $('winNext').textContent = S.level < CONFIG.LEVEL_COUNT ? '下一關' : '回到第 1 關';
      $('winPick').hidden = false;
    } else {
      $('winTitle').textContent = '完成了';
      $('winNext').textContent = '再來一盤';
      $('winPick').hidden = true;
    }
    DB.cur = { mode:S.mode, level:S.level };
    persist(); render();
    $('winText').innerHTML = line;
    setTimeout(()=>$('winBox').classList.add('show'), 350);
  }

  // ============================================================
  // 渲染：盤面
  // ============================================================
  const cells = [];
  for (let i=0;i<81;i++){
    const el = document.createElement('div');
    el.setAttribute('role','gridcell'); el.tabIndex = -1;
    el.addEventListener('pointerdown', e => { e.preventDefault(); select(i); });
    board.appendChild(el); cells.push(el);
  }
  const padBtns = [];
  for (let d=1; d<=9; d++){
    const b = document.createElement('button');
    b.innerHTML = `<span class="d">${d}</span><span class="n"></span>`;
    b.setAttribute('aria-label', '填入 '+d);
    b.addEventListener('click', () => input(d));
    pad.appendChild(b); padBtns.push(b);
  }

  function render(popIndex){
    if (!S) return;
    const sel = S.sel, selVal = sel>=0 ? S.values[sel] : 0;
    const peerSet = sel>=0 ? new Set(PEERS[sel]) : new Set();
    for (let i=0;i<81;i++){
      const el = cells[i], v = S.values[i];
      const cls = ['cell'];
      if (C(i)===2||C(i)===5) cls.push('br');
      if (R(i)===2||R(i)===5) cls.push('bb');
      if (S.puzzle[i]) cls.push('given'); else if (v) cls.push('user');
      if (v && !S.puzzle[i] && v!==S.solution[i]) cls.push('wrong');
      if (i===sel) cls.push('sel');
      else if (selVal && v===selVal) cls.push('same');
      else if (peerSet.has(i)) cls.push('peer');
      if (i===popIndex) cls.push('pop');
      el.className = cls.join(' ');
      if (v){ el.textContent = v; el.setAttribute('aria-label', `第${R(i)+1}列第${C(i)+1}行，${v}`); }
      else if (S.notes[i]){
        el.innerHTML = '<div class="notes">' + [1,2,3,4,5,6,7,8,9].map(d =>
          `<span class="${(S.notes[i]&(1<<d)) && d===selVal ? 'hl':''}">${S.notes[i]&(1<<d) ? d : ''}</span>`).join('') + '</div>';
        el.setAttribute('aria-label', `第${R(i)+1}列第${C(i)+1}行，筆記 ${bits(S.notes[i]).join(' ')}`);
      } else { el.textContent = ''; el.setAttribute('aria-label', `第${R(i)+1}列第${C(i)+1}行，空白`); }
    }
    const counts = new Array(10).fill(0);
    S.values.forEach((v,k)=>{ if (v && v===S.solution[k]) counts[v]++; });
    padBtns.forEach((b,k)=>{ const left = 9-counts[k+1]; b.querySelector('.n').textContent = left; b.classList.toggle('done', left===0); });
    pad.classList.toggle('notes-on', S.notesMode);
    $('notes').setAttribute('aria-pressed', S.notesMode);
    $('hintsLeft').textContent = S.hints;
    $('hint').disabled = S.hints<=0 || S.done;
    $('undo').disabled = !S.history.length || S.done;
    $('mistakes').textContent = S.mistakes;
    $('timer').textContent = fmt(S.time);
    // 模式列
    if (S.mode==='level'){
      $('modeMain').textContent = `第 ${S.level} 關`;
      const best = DB.best[S.level];
      $('modeSub').textContent = best!=null ? `已過關・最佳 ${fmt(best)}` : '點這裡選關';
      $('boardBtn').textContent = '隨機盤面';
    } else {
      $('modeMain').textContent = '隨機盤面';
      $('modeSub').textContent = '不在關卡編號內・點這裡選關';
      $('boardBtn').textContent = '換一盤';
    }
    if (CONFIG.DEBUG) $('dbgSeed').textContent = 'seed ' + S.seed;
  }

  // ============================================================
  // 渲染：選關畫面
  // ============================================================
  let page = 0;
  const pageCount = Math.ceil(CONFIG.LEVEL_COUNT / CONFIG.PAGE_SIZE);
  function openPicker(){
    if (S && S.mode==='level') page = Math.floor((S.level-1)/CONFIG.PAGE_SIZE);
    $('jumpErr').textContent = ''; $('jumpInput').value = '';
    renderPicker(); $('pickerBox').classList.add('show');
  }
  const closePicker = () => $('pickerBox').classList.remove('show');
  function renderPicker(){
    const a = page*CONFIG.PAGE_SIZE + 1, b = Math.min(a+CONFIG.PAGE_SIZE-1, CONFIG.LEVEL_COUNT);
    $('pageLabel').textContent = `${a}–${b}`;
    $('pagePrev').disabled = page===0; $('pageNext').disabled = page===pageCount-1;
    $('clearedCount').textContent = `已過關 ${Object.keys(DB.best).length} / ${CONFIG.LEVEL_COUNT}`;
    let html = '';
    for (let n=a; n<=b; n++){
      const cls = [];
      if (DB.best[n]!=null) cls.push('cleared');
      const rec = DB.prog['L'+n]; if (rec && rec.u) cls.push('going');
      if (S && S.mode==='level' && S.level===n) cls.push('current');
      const state = DB.best[n]!=null ? '，已過關' : (rec && rec.u ? '，進行中' : '');
      html += `<button class="${cls.join(' ')}" data-n="${n}" aria-label="第${n}關${state}">${n}</button>`;
    }
    $('levelGrid').innerHTML = html;
  }
  function jump(){
    const n = parseInt($('jumpInput').value, 10);
    if (!(n>=1 && n<=CONFIG.LEVEL_COUNT)) { $('jumpErr').textContent = `請輸入 1–${CONFIG.LEVEL_COUNT}`; return; }
    closePicker(); openLevel(n);
  }

  // ============================================================
  // 事件
  // ============================================================
  $('undo').onclick = undo;
  $('erase').onclick = erase;
  $('hint').onclick = hint;
  $('notes').onclick = () => { S.notesMode = !S.notesMode; render(); snapshot(); };
  $('modeBtn').onclick = openPicker;
  $('randLevelBtn').onclick = randomLevel;
  $('boardBtn').onclick = () => {
    if (S.mode!=='random') { openRandomBoard(false); return; }
    const played = !S.done && S.values.some((v,k)=>v && !S.puzzle[k]);
    if (played) $('confirmBox').classList.add('show'); else openRandomBoard(true);
  };
  $('cancelNew').onclick = () => $('confirmBox').classList.remove('show');
  $('confirmNew').onclick = () => { $('confirmBox').classList.remove('show'); openRandomBoard(true); };
  $('winNext').onclick = () => {
    $('winBox').classList.remove('show');
    if (S.mode==='level') openLevel(S.level < CONFIG.LEVEL_COUNT ? S.level+1 : 1); else openRandomBoard(true);
  };
  $('winPick').onclick = () => { $('winBox').classList.remove('show'); openPicker(); };
  $('pickerClose').onclick = closePicker;
  $('pagePrev').onclick = () => { if (page>0){ page--; renderPicker(); } };
  $('pageNext').onclick = () => { if (page<pageCount-1){ page++; renderPicker(); } };
  $('levelGrid').onclick = e => { const b = e.target.closest('button[data-n]'); if (b){ closePicker(); openLevel(+b.dataset.n); } };
  $('jumpBtn').onclick = jump;
  $('jumpInput').addEventListener('keydown', e => { if (e.key==='Enter') jump(); });

  document.addEventListener('keydown', e => {
    if (e.key==='Escape'){ closePicker(); $('confirmBox').classList.remove('show'); return; }
    if (!S || anyOverlay()) return;
    const k = e.key;
    if ((e.ctrlKey||e.metaKey) && k.toLowerCase()==='z'){ e.preventDefault(); undo(); return; }
    if (/^[1-9]$/.test(k)){ input(+k); return; }
    if (k==='Backspace'||k==='Delete'||k==='0'){ erase(); return; }
    if (k==='n'||k==='N'){ S.notesMode=!S.notesMode; render(); return; }
    const mv = {ArrowUp:-9, ArrowDown:9, ArrowLeft:-1, ArrowRight:1}[k];
    if (mv!==undefined){
      e.preventDefault();
      let i = S.sel<0 ? 0 : S.sel;
      if (mv===-1 && C(i)===0) i+=8; else if (mv===1 && C(i)===8) i-=8; else i=(i+mv+81)%81;
      select(i);
    }
  });

  // ============================================================
  // 除錯列（CONFIG.DEBUG 為 true 時才出現）
  // ============================================================
  if (CONFIG.DEBUG){
    const bar = document.createElement('div');
    bar.className = 'debug';
    bar.innerHTML = '<span id="fps">-- FPS</span><span id="dbgSeed"></span>' +
      '<button data-a="restart">重開</button><button data-a="solve">完成</button><button data-a="next">下一關</button>';
    document.body.appendChild(bar);
    let frames = 0, last = performance.now();
    (function loop(now){ frames++; if (now-last >= 1000){ $('fps').textContent = frames + ' FPS'; frames = 0; last = now; } requestAnimationFrame(loop); })(last);
    bar.onclick = e => {
      const a = e.target.dataset.a; if (!a || !S) return;
      if (a==='restart'){ delete DB.prog[keyOf(S.mode, S.level)]; S.done = true; start(S.mode, S.level, S.seed); }
      if (a==='solve' && !S.done){ S.values = S.solution.slice(); checkWin(); }
      if (a==='next') openLevel(S.mode==='level' ? S.level+1 : 1);
    };
  }

  // ============================================================
  // 啟動：回到上次的關卡或隨機盤面
  // ============================================================
  try { localStorage.removeItem('sudoku-save-v1'); } catch(e){}   // 清掉舊版存檔
  if (DB.cur && DB.cur.mode==='random' && DB.prog.R) openRandomBoard(false);
  else if (DB.cur && DB.cur.mode==='level') openLevel(DB.cur.level);
  else openLevel(1);
})();
</script>

<script>
// ===== PWA：離線快取與版本更新 =====
(() => {
  if (!('serviceWorker' in navigator)) return;
  const toast = document.getElementById('updateToast');
  let waitingWorker = null, userAskedUpdate = false;

  const showUpdate = w => { waitingWorker = w; toast.classList.add('show'); };
  document.getElementById('updateBtn').onclick = () => {
    if (!waitingWorker) return;
    userAskedUpdate = true;
    waitingWorker.postMessage({ type: 'SKIP_WAITING' });
  };
  // 新版接手後重新載入（只在玩家按了「更新」時才重載，遊戲進度已存在 localStorage）
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (userAskedUpdate) location.reload(); });
  navigator.serviceWorker.addEventListener('message', e => {
    if (e.data && e.data.type === 'VERSION') document.getElementById('ver').textContent = '版本 ' + e.data.version;
  });

  window.addEventListener('load', async () => {
    try {
      const reg = await navigator.serviceWorker.register('./service-worker.js');
      if (reg.waiting && navigator.serviceWorker.controller) showUpdate(reg.waiting);
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing;
        if (!nw) return;
        nw.addEventListener('statechange', () => {
          if (nw.state === 'installed' && navigator.serviceWorker.controller) showUpdate(nw);
        });
      });
      navigator.serviceWorker.ready.then(r => r.active && r.active.postMessage({ type: 'GET_VERSION' }));
      // iPhone 上從背景切回 App 時也檢查一次更新
      document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update().catch(() => {}); });
    } catch (err) {
      console.warn('Service Worker 註冊失敗（用 file:// 直接開檔時屬正常）', err);
    }
  });
})();
</script>
